<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the day</title>
     <!-- BOOTSTRAP CDN LINK -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div style="height: 100vh;" class="container d-flex justify-content-center align-items-center flex-column">
        <h1 class="text-primary">Quote of the day</h1>
       <div id="result" class="w-50">
            
       </div>
    </div>
    
</body>
<script>
    fetch("https://dummyjson.com/quotes",{
        method:"GET"
    }).then(response=>{
      return response.json()   
    }).then(serverResponse=>{
        console.log(serverResponse);
      const allQuotes = serverResponse.quotes
      console.log(allQuotes);
      const randomIndex = Math.floor(Math.random()*allQuotes.length)
      console.log(randomIndex);
      const randomQuotes = allQuotes[randomIndex]
      console.log(randomQuotes);

      result.innerHTML = `
          <div class="border rounded shadow w-100 p-5">
                <h4>${randomQuotes.quote}</h4>
                <p class="text-danger float-end">- ${randomQuotes.author}</p>
            </div>
      `
      
    })
</script>
</html>
